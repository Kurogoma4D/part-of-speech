name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Versions come from mise.toml and web/package.json (packageManager).
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache: true
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      # biome / tsc / vitest cover both web/src and web/worker.
      - name: Lint
        run: pnpm --dir web run lint
      - name: Typecheck
        run: pnpm --dir web run typecheck
      - name: Test
        run: pnpm --dir web run test
      - name: Build
        run: pnpm --dir web run build
      - name: Dry-run deploy
        run: pnpm --dir web exec wrangler deploy --dry-run

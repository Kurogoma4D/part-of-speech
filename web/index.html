<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>part-of-speech</title>
    <meta
      name="description"
      content="日本語の文章を形態素解析し、各語を [名詞] や [動詞] などの品詞タグに置き換えるツール。解析はすべてブラウザ内で完結します。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="part-of-speech" />
    <meta property="og:title" content="part-of-speech" />
    <meta
      property="og:description"
      content="日本語の文章を [名詞][助詞][動詞] のような品詞タグに置き換える。解析はすべてブラウザ内で完結します。"
    />
    <meta property="og:url" content="https://kurogoma4d.github.io/part-of-speech/" />
    <meta property="og:image" content="https://kurogoma4d.github.io/part-of-speech/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="part-of-speech のロゴと、日本語を品詞タグに置き換える例" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <header class="site-header">
      <img class="site-header__logo" src="/logo.svg" alt="" width="32" height="32" />
      <span class="site-header__name">part-of-speech</span>
    </header>
    <main class="converter">
      <section class="pane">
        <label class="pane__label" for="input">入力</label>
        <textarea
          id="input"
          class="pane__box pane__box--input"
          rows="8"
          placeholder="ここに日本語の文章を入力"
          spellcheck="false"
          autocomplete="off"
        ></textarea>
      </section>
      <section class="pane">
        <h2 class="pane__label" id="output-label">結果</h2>
        <output id="output" class="pane__box pane__box--output" aria-labelledby="output-label"></output>
        <p id="status" class="status" role="status"></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

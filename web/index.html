<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>例の歌詞のやつ</title>
    <meta
      name="description"
      content="日本語の文章を AI で分かち書きし、各語を [名詞] や [挨拶] などのラベルに置き換えるツール。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="例の歌詞のやつ" />
    <meta property="og:title" content="例の歌詞のやつ" />
    <meta
      property="og:description"
      content="日本語の文章を [名詞][挨拶][人名] のようなラベルに置き換える。"
    />
    <meta property="og:url" content="https://part-of-speech.kurogoma4d.workers.dev/" />
    <meta property="og:image" content="https://part-of-speech.kurogoma4d.workers.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="例の歌詞のやつ のロゴと、日本語を品詞タグに置き換える例" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <header class="site-header">
      <img class="site-header__logo" src="/logo.svg" alt="" width="32" height="32" />
      <span class="site-header__name">例の歌詞のやつ</span>
    </header>
    <main class="converter">
      <section class="pane">
        <label class="pane__label" for="input">入力</label>
        <textarea
          id="input"
          class="pane__box pane__box--input"
          rows="8"
          placeholder="ここに日本語の文章を入力"
          spellcheck="false"
          autocomplete="off"
          aria-describedby="count"
        ></textarea>
        <p id="count" class="status" aria-live="polite"></p>
        <div id="turnstile"></div>
        <div class="actions">
          <button id="convert" type="button" class="button" disabled>変換</button>
        </div>
      </section>
      <section class="pane">
        <h2 class="pane__label" id="output-label">結果</h2>
        <output id="output" class="pane__box pane__box--output" aria-labelledby="output-label"></output>
        <div class="actions">
          <button id="copy" type="button" class="button" disabled>コピー</button>
          <button id="share" type="button" class="button" disabled>X で共有</button>
          <button id="retry" type="button" class="button" hidden>再試行</button>
        </div>
        <p id="status" class="status" role="status"></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
